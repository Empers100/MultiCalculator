<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор</title>
    <style>
        /* ----- ОСНОВНЫЕ ПЕРЕМЕННЫЕ (СВЕТЛАЯ ТЕМА) ----- */
        :root {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --container-bg: #ffffff;
            --display-bg: #f5f5f5;
            --text-primary: #333333;
            --text-secondary: #666666;
            --tab-bg: #f0f0f0;
            --tab-active-bg: #0096c9;
            --tab-active-text: #ffffff;
            --btn-bg: #e0e0e0;
            --btn-func-bg: #d0d0d0;
            --btn-toggle-bg: #b0b0b0;
            --btn-shadow: rgba(0,0,0,0.1);
            --border-light: #e0e0e0;
            --result-bg: #f0f8ff;
            --menu-bg: #ffffff;
            --menu-shadow: rgba(0,0,0,0.2);
        }

        /* ----- ТЁМНАЯ ТЕМА ----- */
        body.dark {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --container-bg: #2d2d44;
            --display-bg: #1e1e2f;
            --text-primary: #f0f0f0;
            --text-secondary: #cccccc;
            --tab-bg: #3a3a5c;
            --tab-active-bg: #0f3460;
            --tab-active-text: #ffffff;
            --btn-bg: #4a4a6a;
            --btn-func-bg: #5a5a7a;
            --btn-toggle-bg: #3a3a5c;
            --btn-shadow: rgba(0,0,0,0.3);
            --border-light: #444466;
            --result-bg: #1e3a5f;
            --menu-bg: #2d2d44;
            --menu-shadow: rgba(0,0,0,0.5);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
        }

        .calculator-container {
            width: 100%;
            height: 100%;
            max-width: 550px;
            max-height: 90vh;
            background: var(--container-bg);
            display: flex;
            flex-direction: column;
            padding: 12px;
            position: relative;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: background 0.3s, box-shadow 0.3s;
        }

        @media (min-width: 600px) {
            .calculator-container {
                max-height: 850px;
            }
        }

        /* ----- ШАПКА С МЕНЮ ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .tabs {
            display: flex;
            gap: 6px;
            flex: 1;
        }

        .tab {
            flex: 1;
            padding: 12px 4px;
            border: none;
            background: var(--tab-bg);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--tab-active-bg);
            color: var(--tab-active-text);
        }

        .menu-btn {
            width: 40px;
            height: 40px;
            margin-left: 8px;
            border: none;
            background: var(--tab-bg);
            color: var(--text-primary);
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .menu-btn:active {
            background: var(--tab-active-bg);
            color: white;
        }

        /* ----- ВЫПАДАЮЩЕЕ МЕНЮ НАСТРОЕК ----- */
        .settings-menu {
            position: absolute;
            top: 60px;
            right: 12px;
            background: var(--menu-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px var(--menu-shadow);
            padding: 12px;
            z-index: 100;
            min-width: 200px;
            display: none;
            border: 1px solid var(--border-light);
        }

        .settings-menu.show {
            display: block;
        }

        .settings-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 8px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
            font-size: 16px;
        }

        .settings-item:last-child {
            border-bottom: none;
        }

        .settings-item select, .settings-item button {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            background: var(--btn-bg);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
        }

        .theme-toggle {
            width: 50px;
            height: 26px;
            background: var(--tab-bg);
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            border: 1px solid var(--border-light);
        }

        .theme-toggle::after {
            content: '';
            width: 22px;
            height: 22px;
            background: var(--tab-active-bg);
            border-radius: 50%;
            position: absolute;
            top: 1px;
            left: 2px;
            transition: transform 0.2s;
        }

        body.dark .theme-toggle::after {
            transform: translateX(24px);
        }

        /* ----- ОСНОВНОЙ КОНТЕНТ ----- */
        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
        }

        .display-container {
            flex-shrink: 0;
            margin-bottom: 8px;
        }

        .formula-display {
            width: 100%;
            padding: 8px 16px;
            font-size: 14px;
            text-align: right;
            background: var(--display-bg);
            border: none;
            border-radius: 16px 16px 0 0;
            color: var(--text-secondary);
            min-height: 36px;
            word-wrap: break-word;
            border-bottom: 1px solid var(--border-light);
        }

        .main-display {
            width: 100%;
            padding: 16px;
            font-size: clamp(24px, 8vw, 36px);
            text-align: right;
            background: var(--display-bg);
            border: none;
            border-radius: 0 0 16px 16px;
            font-weight: 500;
            color: var(--text-primary);
            outline: none;
            word-wrap: break-word;
        }

        .memory-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .memory-btn {
            padding: 10px 4px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            background: var(--btn-func-bg);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s;
            color: var(--text-primary);
            box-shadow: 0 2px 4px var(--btn-shadow);
        }

        .memory-btn:active {
            background: var(--tab-active-bg);
            color: white;
            transform: scale(0.95);
        }

        .memory-btn:disabled {
            opacity: 0.5;
        }

        .buttons-container {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn {
            padding: 0;
            font-size: clamp(16px, 5vw, 20px);
            font-weight: 500;
            border: none;
            background: var(--btn-bg);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.1s;
            color: var(--text-primary);
            box-shadow: 0 2px 4px var(--btn-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
        }

        .btn:active {
            background: var(--tab-active-bg);
            color: white;
            transform: scale(0.95);
        }

        .btn.func {
            background: var(--btn-func-bg);
        }

        /* ----- ДАТЫ ----- */
        .date-section {
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .date-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .date-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: nowrap;
        }

        .date-inputs input,
        .date-inputs select {
            padding: 12px 8px;
            font-size: 16px;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            text-align: center;
            background: var(--display-bg);
            color: var(--text-primary);
            flex: 1 1 0;
            min-width: 0;
        }

        .calculate-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            background: var(--tab-active-bg);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            margin: 12px 0;
            flex-shrink: 0;
        }

        .calculate-btn:active {
            opacity: 0.8;
        }

        .result {
            text-align: center;
            padding: 16px;
            background: var(--result-bg);
            border-radius: 16px;
            flex-shrink: 0;
        }

        .result-main {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-primary);
        }

        .result-detail {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>
<div class="calculator-container">
    <!-- ШАПКА -->
    <div class="header">
        <div class="tabs">
            <button class="tab active" data-tab="basic" id="tabBasic">Калькулятор</button>
            <button class="tab" data-tab="date" id="tabDate">Дата</button>
        </div>
        <button class="menu-btn" id="menuToggle">⋮</button>
    </div>

    <!-- МЕНЮ НАСТРОЕК -->
    <div class="settings-menu" id="settingsMenu">
        <div class="settings-item">
            <span id="langLabel">Язык / Language</span>
            <select id="langSelect">
                <option value="ru">Русский</option>
                <option value="en">English</option>
                <option value="zh">中文</option>
            </select>
        </div>
        <div class="settings-item">
            <span id="themeLabel">Тёмная тема</span>
            <div class="theme-toggle" id="themeToggle"></div>
        </div>
        <div class="settings-item">
            <button id="shareBtn" style="flex:1; padding:10px;">📤 Поделиться</button>
        </div>
    </div>

    <!-- ВКЛАДКА КАЛЬКУЛЯТОР -->
    <div id="basic" class="tab-content active">
        <div class="display-container">
            <div class="formula-display" id="formulaDisplay"></div>
            <input type="text" class="main-display" id="basicDisplay" value="0" readonly style="border-radius:0 0 16px 16px;">
        </div>
        <div class="memory-row">
            <button class="memory-btn" data-mem="MC" disabled>MC</button>
            <button class="memory-btn" data-mem="MR" disabled>MR</button>
            <button class="memory-btn" data-mem="M+">M+</button>
            <button class="memory-btn" data-mem="M-">M-</button>
        </div>
        <div class="buttons-container">
            <div class="buttons" id="basicButtons"></div>
        </div>
    </div>

    <!-- ВКЛАДКА ДАТА -->
    <div id="date" class="tab-content">
        <div class="date-section">
            <div class="date-title" id="firstDateLabel">Первая дата</div>
            <div class="date-inputs">
                <input type="number" id="day1" min="1" max="31" value="1" placeholder="ДД">
                <select id="month1"></select>
                <input type="number" id="year1" value="1" placeholder="ГГГГ">
            </div>
        </div>
        <div class="date-section">
            <div class="date-title" id="secondDateLabel">Вторая дата</div>
            <div class="date-inputs">
                <input type="number" id="day2" min="1" max="31" value="1" placeholder="ДД">
                <select id="month2"></select>
                <input type="number" id="year2" value="-1" placeholder="ГГГГ">
            </div>
        </div>
        <button class="calculate-btn" id="calculateDate">Вычислить</button>
        <div class="result">
            <div class="result-main" id="dateResult">Результат: ---</div>
            <div class="result-detail" id="dateDetail"></div>
        </div>
    </div>
</div>

<script>
    (function(){
        'use strict';

        // ---------- ЛОКАЛИЗАЦИЯ ----------
        const locales = {
            ru: {
                basic: 'Калькулятор',
                date: 'Дата',
                firstDate: 'Первая дата',
                secondDate: 'Вторая дата',
                calculate: 'Вычислить',
                result: 'Результат: ---',
                errorInvalidDate: 'Ошибка: некорректная дата',
                errorYearZero: 'Ошибка: год 0 не существует',
                langLabel: 'Язык / Language',
                themeDark: 'Тёмная тема',
                themeLight: 'Светлая тема',
                shareBtn: '📤 Поделиться',
                shareText: 'Многофункциональный калькулятор — попробуй:',
                shareFallback: 'Ссылка скопирована! Расскажи друзьям.',
                diffPrefix: 'Разница:',
                orText: 'Или',
                error: 'Ошибка',
                formatYears: (y) => {
                    if (y === 0) return '0 лет';
                    const last = y % 10, last2 = y % 100;
                    if (last2 >= 11 && last2 <= 14) return y + ' лет';
                    if (last === 1) return y + ' год';
                    if (last >= 2 && last <= 4) return y + ' года';
                    return y + ' лет';
                },
                formatMonths: (m) => {
                    if (m === 0) return '0 месяцев';
                    const last = m % 10, last2 = m % 100;
                    if (last2 >= 11 && last2 <= 14) return m + ' месяцев';
                    if (last === 1) return m + ' месяц';
                    if (last >= 2 && last <= 4) return m + ' месяца';
                    return m + ' месяцев';
                },
                formatDays: (d) => {
                    if (d === 0) return '0 дней';
                    const last = d % 10, last2 = d % 100;
                    if (last2 >= 11 && last2 <= 14) return d + ' дней';
                    if (last === 1) return d + ' день';
                    if (last >= 2 && last <= 4) return d + ' дня';
                    return d + ' дней';
                }
            },
            en: {
                basic: 'Calculator',
                date: 'Date',
                firstDate: 'First date',
                secondDate: 'Second date',
                calculate: 'Calculate',
                result: 'Result: ---',
                errorInvalidDate: 'Error: invalid date',
                errorYearZero: 'Error: year 0 does not exist',
                langLabel: 'Language',
                themeDark: 'Dark theme',
                themeLight: 'Light theme',
                shareBtn: '📤 Share',
                shareText: 'Multi Calculator — try it:',
                shareFallback: 'Link copied! Tell your friends.',
                diffPrefix: 'Difference:',
                orText: 'Or',
                error: 'Error',
                formatYears: (y) => y + (y === 1 ? ' year' : ' years'),
                formatMonths: (m) => m + (m === 1 ? ' month' : ' months'),
                formatDays: (d) => d + (d === 1 ? ' day' : ' days')
            },
            zh: {
                basic: '计算器',
                date: '日期',
                firstDate: '第一个日期',
                secondDate: '第二个日期',
                calculate: '计算',
                result: '结果：---',
                errorInvalidDate: '错误：无效日期',
                errorYearZero: '错误：公元0年不存在',
                langLabel: '语言',
                themeDark: '深色主题',
                themeLight: '浅色主题',
                shareBtn: '📤 分享',
                shareText: '多功能计算器 — 试试看：',
                shareFallback: '链接已复制！分享给朋友吧。',
                diffPrefix: '相差：',
                orText: '或',
                error: '错误',
                formatYears: (y) => y + '年',
                formatMonths: (m) => m + '个月',
                formatDays: (d) => d + '天'
            }
        };

        let currentLang = 'ru';
        let lastDateResult = null;
        let memory = 0;

        function getErrorText() { return locales[currentLang].error; }

        const elementsForLang = {
            tabBasic: 'basic', tabDate: 'date',
            firstDateLabel: 'firstDate', secondDateLabel: 'secondDate',
            calculateDate: 'calculate', langLabel: 'langLabel', shareBtn: 'shareBtn'
        };

        function updateThemeLabel() {
            const themeLabel = document.getElementById('themeLabel');
            if (!themeLabel) return;
            const isDark = document.body.classList.contains('dark');
            themeLabel.textContent = isDark ? locales[currentLang].themeDark : locales[currentLang].themeLight;
        }

        function applyLanguage(lang) {
            currentLang = lang;
            Object.keys(elementsForLang).forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = locales[lang][elementsForLang[id]];
            });
            updateThemeLabel();
            const basicDisplay = document.getElementById('basicDisplay');
            if (basicDisplay && (basicDisplay.value === 'Ошибка' || basicDisplay.value === 'Error' || basicDisplay.value === '错误')) {
                basicDisplay.value = getErrorText();
            }
            if (lastDateResult) { updateDateDisplay(); } else {
                const dateResult = document.getElementById('dateResult');
                const dateDetail = document.getElementById('dateDetail');
                if (dateResult) dateResult.textContent = locales[lang].result;
                if (dateDetail) dateDetail.textContent = '';
            }
            localStorage.setItem('calc_lang', lang);
        }

        function updateDateDisplay() {
            if (!lastDateResult) return;
            const loc = locales[currentLang];
            const { years, months, days, total } = lastDateResult;
            const yearStr = loc.formatYears(years);
            const monthStr = loc.formatMonths(months);
            const dayStr = loc.formatDays(days);
            const totalStr = loc.formatDays(total);
            const dateResult = document.getElementById('dateResult');
            const dateDetail = document.getElementById('dateDetail');
            if (dateResult) dateResult.textContent = `${loc.diffPrefix} ${yearStr} ${monthStr} ${dayStr}`;
            if (dateDetail) dateDetail.textContent = `${loc.orText} ${totalStr}`;
        }

        // ---------- ТЕМЫ ----------
        function initTheme() {
            const saved = localStorage.getItem('calc_theme');
            if (saved === 'dark') document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            updateThemeLabel();
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
            localStorage.setItem('calc_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
            updateThemeLabel();
        }

        // ---------- МЕНЮ НАСТРОЕК ----------
        const menuToggle = document.getElementById('menuToggle');
        const settingsMenu = document.getElementById('settingsMenu');
        if (menuToggle && settingsMenu) {
            menuToggle.addEventListener('click', (e) => { e.stopPropagation(); settingsMenu.classList.toggle('show'); });
            document.addEventListener('click', (e) => { if (!settingsMenu.contains(e.target) && e.target !== menuToggle) settingsMenu.classList.remove('show'); });
        }

        const langSelect = document.getElementById('langSelect');
        if (langSelect) {
            langSelect.value = localStorage.getItem('calc_lang') || 'ru';
            applyLanguage(langSelect.value);
            langSelect.addEventListener('change', (e) => applyLanguage(e.target.value));
        }

        initTheme();
        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) themeToggle.addEventListener('click', toggleTheme);

        // ---------- Поделиться ----------
        const shareBtn = document.getElementById('shareBtn');
        if (shareBtn) {
            shareBtn.addEventListener('click', () => {
                let shareText = '';
                const activeTab = document.querySelector('.tab.active')?.dataset.tab;
                if (activeTab === 'basic') {
                    const display = document.getElementById('basicDisplay');
                    if (display) {
                        const value = display.value;
                        if (value && value !== getErrorText()) {
                            if (currentLang === 'ru') shareText = `Результат вычисления: ${value}`;
                            else if (currentLang === 'en') shareText = `Calculation result: ${value}`;
                            else shareText = `计算结果：${value}`;
                        } else shareText = locales[currentLang].shareText;
                    }
                } else if (activeTab === 'date') {
                    if (lastDateResult) {
                        const loc = locales[currentLang];
                        const { years, months, days, total } = lastDateResult;
                        shareText = `${loc.diffPrefix} ${loc.formatYears(years)} ${loc.formatMonths(months)} ${loc.formatDays(days)}. ${loc.orText} ${loc.formatDays(total)}.`;
                    } else {
                        if (currentLang === 'ru') shareText = 'Калькулятор дат — вычисли разницу между датами!';
                        else if (currentLang === 'en') shareText = 'Date calculator — compute date difference!';
                        else shareText = '日期计算器 — 计算两个日期之间的差异！';
                    }
                }
                const shareUrl = 'https://github.com/Empers100/MultiCalculator';
                const title = 'Multi Calculator';
                if (typeof AndroidShare !== 'undefined' && AndroidShare.shareText) {
                    AndroidShare.shareText(title, shareText, shareUrl);
                } else if (navigator.share) {
                    navigator.share({ title, text: shareText, url: shareUrl }).catch(() => {});
                }
                if (settingsMenu) settingsMenu.classList.remove('show');
            });
        }

        // ---------- ФОРМАТИРОВАНИЕ ЧИСЛА ----------
        function formatNumber(num) {
            if (isNaN(num)) return getErrorText();
            if (!isFinite(num)) return num > 0 ? '∞' : '-∞';
            if (Number.isInteger(num)) return num.toString();
            const absNum = Math.abs(num);
            if (absNum < 1e-12 && absNum > 0) return num.toExponential(6).replace(/\.?0+e/, 'e');
            if (absNum > 1e12) return num.toExponential(6).replace(/\.?0+e/, 'e');
            return num.toFixed(12).replace(/\.?0+$/, '');
        }

        // ---------- ПАМЯТЬ ----------
        function updateMemoryButtons() {
            const mcBtns = document.querySelectorAll('.memory-btn[data-mem="MC"]');
            const mrBtns = document.querySelectorAll('.memory-btn[data-mem="MR"]');
            const disabled = (memory === 0);
            mcBtns.forEach(btn => { btn.disabled = disabled; });
            mrBtns.forEach(btn => { btn.disabled = disabled; });
        }

        function handleMemory(action, displayElement) {
            const currentValue = parseFloat(displayElement.value);
            if (isNaN(currentValue) && (action === 'M+' || action === 'M-')) return;
            switch (action) {
                case 'MC': memory = 0; break;
                case 'MR': displayElement.value = formatNumber(memory); break;
                case 'M+': memory += currentValue; break;
                case 'M-': memory -= currentValue; break;
            }
            updateMemoryButtons();
        }

        // ---------- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ----------
        const tabs = document.querySelectorAll('.tab');
        const contents = document.querySelectorAll('.tab-content');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const target = tab.dataset.tab;
                tabs.forEach(t => t.classList.remove('active'));
                contents.forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                const targetEl = document.getElementById(target);
                if (targetEl) targetEl.classList.add('active');
                updateMemoryButtons();
            });
        });

        // ========== ОБЫЧНЫЙ КАЛЬКУЛЯТОР ==========

const basicDisplay = document.getElementById('basicDisplay');
const formulaDisplay = document.getElementById('formulaDisplay');

let basicResult = 0;
let basicLastOp = '';
let basicStart = true;
let basicCurrent = 0;
let basicPercentUsed = false;

// Переменные для формулы в стиле Windows
let formulaStr = '';      // накопленная часть выражения слева от текущего операнда
let curExpr = '0';        // текстовое представление текущего операнда (может быть обёрнуто функциями)
let lastWasEqual = false; // флаг, что последней операцией было "="
let lastWasOperator = false; // флаг, что последним было нажатие оператора
let pendingOperator = false; // ожидается ввод нового операнда (после оператора)

function updateFormula(text) {
    if (formulaDisplay) formulaDisplay.textContent = text || '';
}

function basicCalculate(num) {
    switch (basicLastOp) {
        case '+': basicResult += num; break;
        case '-': basicResult -= num; break;
        case '×': basicResult *= num; break;
        case '÷': 
            if(num === 0){ 
                basicDisplay.value = getErrorText(); 
                formulaStr = ''; 
                curExpr = '0'; 
                updateFormula(''); 
                basicStart = true;
                pendingOperator = false;
                lastWasOperator = false;
                return; 
            } 
            basicResult /= num; 
            break;
        default: basicResult = num;
    }
    basicCurrent = basicResult;
    basicDisplay.value = formatNumber(basicResult);
}

function handleBasic(text) {
    if (!basicDisplay) return;
    try {
        // Если на дисплее ошибка и нажата не "C", сбрасываем ошибку
        if (basicDisplay.value === getErrorText() && text !== 'C') {
            basicDisplay.value = '0';
            basicCurrent = 0;
            basicStart = true;
            formulaStr = '';
            curExpr = '0';
            lastWasEqual = false;
            lastWasOperator = false;
            pendingOperator = false;
            updateFormula('');
        }

        // Обработка цифр и точки
        if (text !== 'C' && text !== '⌫' && text !== '±' && text !== '√' 
            && text !== '1/x' && text !== 'x²' && text !== 'x³' && text !== '%' 
            && text !== '÷' && text !== '×' && text !== '-' && text !== '+' && text !== '=') {
            
            // Это цифра или точка
            if (lastWasEqual) {
                // Начинаем новое выражение
                formulaStr = '';
                curExpr = text;
                lastWasEqual = false;
                basicStart = false;
                pendingOperator = false;
                lastWasOperator = false;
                basicDisplay.value = text;
                updateFormula(curExpr);
                basicCurrent = parseFloat(text) || 0;
                return;
            }

            if (pendingOperator) {
                // После оператора начинаем новый операнд
                curExpr = text;
                basicDisplay.value = text;
                basicStart = false;
                pendingOperator = false;
                lastWasOperator = false;
            } else if (basicStart || basicDisplay.value === '0') {
                if (text === '.' && basicDisplay.value === '0') {
                    basicDisplay.value = '0.';
                    curExpr = '0.';
                } else {
                    basicDisplay.value = text;
                    curExpr = text;
                }
                basicStart = false;
            } else {
                if (text === '.' && basicDisplay.value.indexOf('.') !== -1) return;
                basicDisplay.value += text;
                curExpr += text;
            }
            
            basicCurrent = parseFloat(basicDisplay.value) || 0;
            updateFormula(formulaStr + curExpr);
            return;
        }

        // Сброс ошибки уже сделали выше, если нужно

        switch (text) {
            case 'C':
                basicDisplay.value = '0';
                basicResult = 0;
                basicCurrent = 0;
                basicLastOp = '';
                basicStart = true;
                basicPercentUsed = false;
                formulaStr = '';
                curExpr = '0';
                lastWasEqual = false;
                lastWasOperator = false;
                pendingOperator = false;
                updateFormula('');
                break;

            case '⌫':
                if (lastWasEqual || lastWasOperator || pendingOperator) {
                    // После = или оператора бэкспейс не имеет смысла
                    break;
                }
                let s = basicDisplay.value;
                if (s.length > 1 && s !== '0') {
                    basicDisplay.value = s.slice(0, -1);
                    curExpr = curExpr.slice(0, -1);
                    if (curExpr === '' || curExpr === '-') {
                        curExpr = '0';
                        basicDisplay.value = '0';
                        basicStart = true;
                    }
                } else {
                    basicDisplay.value = '0';
                    curExpr = '0';
                    basicStart = true;
                }
                basicCurrent = parseFloat(basicDisplay.value) || 0;
                updateFormula(formulaStr + curExpr);
                break;

            case '±':
                if (lastWasEqual) {
                    // Меняем знак результата, начинаем новое выражение с этого числа
                    basicCurrent = -basicCurrent;
                    basicDisplay.value = formatNumber(basicCurrent);
                    curExpr = basicCurrent < 0 ? '-' + Math.abs(basicCurrent) : String(basicCurrent);
                    formulaStr = '';
                    lastWasEqual = false;
                    basicStart = false;
                    updateFormula(curExpr);
                } else if (pendingOperator) {
                    // После оператора вводим отрицательное число
                    basicCurrent = -0; // специальное состояние
                    basicDisplay.value = '-0';
                    curExpr = '-0';
                    pendingOperator = false;
                    basicStart = false;
                    updateFormula(formulaStr + curExpr);
                } else {
                    basicCurrent = -basicCurrent;
                    basicDisplay.value = formatNumber(basicCurrent);
                    // Для формулы: если curExpr уже обёрнут в negate, убираем; иначе оборачиваем
                    if (curExpr.startsWith('negate(') && curExpr.endsWith(')')) {
                        curExpr = curExpr.slice(7, -1);
                    } else if (curExpr.startsWith('-')) {
                        curExpr = curExpr.slice(1);
                    } else {
                        curExpr = 'negate(' + curExpr + ')';
                    }
                    updateFormula(formulaStr + curExpr);
                }
                break;

            case '√':
                if (basicCurrent < 0) {
                    basicDisplay.value = getErrorText();
                    formulaStr = ''; 
                    curExpr = '0'; 
                    updateFormula('');
                    basicStart = true;
                    pendingOperator = false;
                    lastWasOperator = false;
                } else {
                    basicCurrent = Math.sqrt(basicCurrent);
                    basicDisplay.value = formatNumber(basicCurrent);
                    curExpr = 'sqrt(' + curExpr + ')';
                    basicStart = false; // можно продолжать ввод числа? Нет, функция завершает операнд
                    updateFormula(formulaStr + curExpr);
                }
                break;

            case '1/x':
                if (basicCurrent === 0) {
                    basicDisplay.value = getErrorText();
                    formulaStr = ''; 
                    curExpr = '0'; 
                    updateFormula('');
                    basicStart = true;
                    pendingOperator = false;
                    lastWasOperator = false;
                } else {
                    basicCurrent = 1 / basicCurrent;
                    basicDisplay.value = formatNumber(basicCurrent);
                    curExpr = 'reciprocal(' + curExpr + ')';
                    basicStart = false;
                    updateFormula(formulaStr + curExpr);
                }
                break;

            case 'x²':
                basicCurrent = basicCurrent ** 2;
                basicDisplay.value = formatNumber(basicCurrent);
                curExpr = 'sqr(' + curExpr + ')';
                basicStart = false;
                updateFormula(formulaStr + curExpr);
                break;

            case 'x³':
                basicCurrent = basicCurrent ** 3;
                basicDisplay.value = formatNumber(basicCurrent);
                curExpr = 'cube(' + curExpr + ')';
                basicStart = false;
                updateFormula(formulaStr + curExpr);
                break;

            case '%':
                if (basicLastOp) {
                    basicCurrent = basicResult * basicCurrent / 100;
                } else {
                    basicCurrent = basicCurrent / 100;
                }
                basicDisplay.value = formatNumber(basicCurrent);
                curExpr = curExpr + '%';
                basicPercentUsed = true;
                basicStart = false;
                updateFormula(formulaStr + curExpr);
                break;

            case '÷': 
            case '×': 
            case '-': 
            case '+':
                if (lastWasEqual) {
                    // Продолжаем вычисление с результатом
                    formulaStr = basicDisplay.value;
                    lastWasEqual = false;
                    curExpr = '0';
                } else if (lastWasOperator || pendingOperator) {
                    // СМЕНА ОПЕРАТОРА: просто меняем оператор в формуле, не добавляя операнд
                    // Убираем последний оператор из formulaStr и ставим новый
                    formulaStr = formulaStr.trim();
                    if (formulaStr.length > 0) {
                        // Удаляем последний символ оператора (и пробелы)
                        formulaStr = formulaStr.replace(/[+\-×÷]\s*$/, '') + text + ' ';
                    } else {
                        formulaStr = basicDisplay.value + ' ' + text + ' ';
                    }
                    basicLastOp = text;
                    updateFormula(formulaStr);
                    return; // ВАЖНО: выходим, не меняя состояние операнда
                } else {
                    // Добавляем текущий операнд в формулу
                    formulaStr += curExpr;
                }

                // Обработка процента, если он был
                if (basicPercentUsed) {
                    basicCalculate(basicCurrent);
                    basicPercentUsed = false;
                } else if (!basicStart) {
                    basicCalculate(basicCurrent);
                }

                formulaStr += ' ' + text + ' ';
                basicLastOp = text;
                basicStart = true;
                pendingOperator = true;
                lastWasOperator = true;
                curExpr = '0';
                updateFormula(formulaStr);
                break;

            case '=':
                if (lastWasEqual) {
                    break;
                }

                // Добавляем текущий операнд
                formulaStr += curExpr;
                
                if (basicPercentUsed) {
                    basicCalculate(basicCurrent);
                    basicPercentUsed = false;
                } else {
                    basicCalculate(basicCurrent);
                }
                
                formulaStr += ' =';
                basicLastOp = '';
                basicStart = true;
                lastWasEqual = true;
                lastWasOperator = false;
                pendingOperator = false;
                curExpr = formatNumber(basicCurrent);
                updateFormula(formulaStr);
                break;
        }
    } catch (e) {
        basicDisplay.value = getErrorText();
        basicStart = true;
        formulaStr = '';
        curExpr = '0';
        lastWasEqual = false;
        lastWasOperator = false;
        pendingOperator = false;
        updateFormula('');
    }
}
        function initBasic() {
            var basicLayout = [
                ['C','⌫','%','÷'],
                ['7','8','9','×'],
                ['4','5','6','-'],
                ['1','2','3','+'],
                ['±','0','.','='],
                ['√','1/x','x²','x³']
            ];
            var div = document.getElementById('basicButtons');
            if (!div) return;
            div.innerHTML = '';
            basicLayout.forEach(row => row.forEach(txt => {
                if(!txt) return;
                var btn = document.createElement('button');
                btn.className = 'btn' + (isNaN(txt) && txt!=='.' ? ' func' : '');
                btn.textContent = txt;
                btn.onclick = (function(t){ return function(){ handleBasic(t); }; })(txt);
                div.appendChild(btn);
            }));
            document.querySelectorAll('#basic .memory-btn').forEach(btn =>
                btn.addEventListener('click', () => handleMemory(btn.dataset.mem, basicDisplay))
            );
            updateMemoryButtons();
        }

        initBasic();

        // ---------- КАЛЬКУЛЯТОР ДАТ ----------
        function initDate() {
            var monthSelect1 = document.getElementById('month1'), monthSelect2 = document.getElementById('month2');
            if (!monthSelect1 || !monthSelect2) return;
            for(var i=1; i<=12; i++){ monthSelect1.add(new Option(i,i)); monthSelect2.add(new Option(i,i)); }
            monthSelect1.value='1'; monthSelect2.value='1';

            function isLeap(year){ if(year===0)return false; var absY=Math.abs(year); return(absY%4===0&&absY%100!==0)||(absY%400===0); }
            function daysInMonth(month,year){ if(month===2)return isLeap(year)?29:28; return[4,6,9,11].indexOf(month)!==-1?30:31; }
            function isValid(day,month,year){ if(year===0)return false; if(month<1||month>12||day<1)return false; return day<=daysInMonth(month,year); }
            function compareDates(y1,m1,d1,y2,m2,d2){ if(y1!==y2)return y1-y2; if(m1!==m2)return m1-m2; return d1-d2; }
            function dateToAbs(year,month,day){ var days=0; if(year>0){ for(var y=1;y<year;y++)days+=isLeap(y)?366:365; } else if(year<0){ for(var y=year;y<0;y++)days-=isLeap(y)?366:365; } for(var m=1;m<month;m++)days+=daysInMonth(m,year); return days+day-1; }

            function calculateDateDiff(y1,m1,d1,y2,m2,d2){
                var fromY=y1, fromM=m1, fromD=d1, toY=y2, toM=m2, toD=d2;
                if(compareDates(y1,m1,d1,y2,m2,d2)>0){
                    var tmp;
                    tmp=fromY; fromY=toY; toY=tmp;
                    tmp=fromM; fromM=toM; toM=tmp;
                    tmp=fromD; fromD=toD; toD=tmp;
                }
                var years = toY - fromY;
                if(toM < fromM || (toM === fromM && toD < fromD)) years--;
                if(fromY < 0 && toY > 0) years--;
                var months = toM >= fromM ? toM - fromM : 12 + toM - fromM;
                if(toD < fromD){ months--; if(months < 0){ months += 12; years--; } }
                var days;
                if(toD >= fromD) days = toD - fromD;
                else { var dim = daysInMonth(fromM, fromY); days = dim - fromD + toD; }
                return { years, months, days };
            }

            function computeAndDisplay() {
                var d1=+document.getElementById('day1').value, m1=+monthSelect1.value, y1=+document.getElementById('year1').value;
                var d2=+document.getElementById('day2').value, m2=+monthSelect2.value, y2=+document.getElementById('year2').value;
                if(!isValid(d1,m1,y1) || !isValid(d2,m2,y2) || y1===0 || y2===0){
                    lastDateResult = null;
                    const dateResult = document.getElementById('dateResult'), dateDetail = document.getElementById('dateDetail');
                    if (dateResult) dateResult.textContent = locales[currentLang].errorInvalidDate;
                    if (dateDetail) dateDetail.textContent = '';
                    return;
                }
                var diff = calculateDateDiff(y1,m1,d1,y2,m2,d2);
                var total = Math.abs(dateToAbs(y1,m1,d1) - dateToAbs(y2,m2,d2));
                lastDateResult = { years: diff.years, months: diff.months, days: diff.days, total: total };
                updateDateDisplay();
            }

            const calculateBtn = document.getElementById('calculateDate');
            if (calculateBtn) calculateBtn.onclick = computeAndDisplay;
            setTimeout(computeAndDisplay, 10);
        }

        initDate();

        // ---------- ПОДДЕРЖКА ФИЗИЧЕСКОЙ КЛАВИАТУРЫ ----------
        function handleKeyDown(e) {
            const key = e.key;
            const activeTab = document.querySelector('.tab-content.active')?.id;
            if (!activeTab) return;
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (/^[0-9.]$/.test(key)) {
                e.preventDefault();
                if (activeTab === 'basic') handleBasic(key);
                return;
            }

            const operatorMap = {
                '+': '+', '-': '-', '*': '×', '/': '÷', 'Enter': '=',
                'Escape': 'C', 'Backspace': '⌫'
            };

            let mapped = operatorMap[key];
            if (!mapped && key === '=') mapped = '=';
            if (!mapped && key === 'Enter') mapped = '=';

            if (mapped) {
                e.preventDefault();
                if (activeTab === 'basic') {
                    if (['+','-','×','÷','=','C','⌫'].includes(mapped)) handleBasic(mapped);
                }
                return;
            }
        }

        document.addEventListener('keydown', handleKeyDown);
    })();
</script>
